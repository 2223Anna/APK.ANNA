<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Anna</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #121212; margin: 0; padding: 0; }

        /* ===== LOGIN ===== */
        #login {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .box {
            background: #1a1a1a; padding: 28px 24px; border-radius: 10px;
            width: 100%; max-width: 360px; border: 1px solid #333;
        }
        h1 { color: #fff; text-align: center; margin: 0 0 20px; font-size: 20px; }
        label { color: #ccc; display: block; margin-bottom: 6px; font-size: 14px; }
        .input-wrap select {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background: #333; color: #fff; font-size: 16px;
        }
        .input-wrap { position: relative; margin-bottom: 14px; }
        .input-wrap input {
            width: 100%; padding: 12px 44px 12px 12px; border: none; border-radius: 6px;
            background: #333; color: #fff; font-size: 16px;
        }
        .mata {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #ccc; font-size: 18px;
            cursor: pointer; padding: 6px;
        }
        button {
            padding: 10px 14px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 15px; font-weight: bold;
        }
        .btn-merah {
            width: 100%; padding: 14px; background: #990000; color: #fff; font-size: 16px;
        }
        .btn-merah:hover { background: #cc0000; }
        #msg { margin-top: 12px; text-align: center; font-size: 14px; min-height: 22px; }
        .ok { color: #6f6; }
        .err { color: #f66; }
        .akun-info {
            margin-top: 16px; padding: 10px; background: #222; border-radius: 6px;
            font-size: 12px; color: #aaa; line-height: 1.6;
        }

        /* ===== APLIKASI ===== */
        #app { display: none; padding: 10px; min-height: 100vh; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
        }
        h2 { color: #fff; margin: 0; font-size: 18px; }
        .role-badge {
            background: #f59e0b; color: #000; padding: 6px 12px; border-radius: 20px;
            font-size: 13px; font-weight: bold;
        }
        .btn-logout { background: #6b7280; color: #fff; font-size: 13px; padding: 8px 12px; }

        .tabs { display: flex; background: #333; border-radius: 6px 6px 0 0; overflow-x: auto; }
        .tab { padding: 12px 16px; color: #ccc; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .tab.active { background: #fff; color: #000; }

        .content { background: #fff; padding: 15px; border-radius: 0 0 6px 6px; min-height: 450px; }
        .page { display: none; }
        .page.active { display: block; }
        h3 { margin: 5px 0 12px; font-size: 17px; }

        select, input.short {
            padding: 10px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 15px; width: 100%; margin: 4px 0;
        }
        p { margin: 10px 0; }

        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14px; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #990000; color: #fff; }

        .btn-amber { background: #f90; color: #fff; }
        .btn-green { background: #2c5; color: #fff; }
        .btn-red { background: #d33; color: #fff; }
        .btn-blue { background: #3b82f6; color: #fff; }
        .btn-gray { background: #6b7280; color: #fff; }

        .total { font-size: 20px; font-weight: bold; color: #900; text-align: right; margin: 12px 0; }
        .kembalian { font-size: 18px; font-weight: bold; color: green; margin-top: 8px; }

        /* ===== MODAL STRUK ===== */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            justify-content: center; align-items: center; padding: 15px; z-index: 999;
        }
        .modal.tampil { display: flex; }
        .modal-box {
            background: #fef3c7; padding: 22px; border-radius: 8px;
            width: 100%; max-width: 360px;
        }
        .modal-box h3 { text-align: center; margin: 0 0 15px; }
        .struk {
            font-family: 'Courier New', monospace; white-space: pre-wrap;
            line-height: 1.5; font-size: 13px; margin-bottom: 15px;
        }
        .modal-tombol { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-tombol button { flex: 1; }

        /* Area cetak (tersembunyi, hanya muncul saat print) */
        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea {
                display: block !important;
                position: absolute; left: 0; top: 0;
                width: 100%; padding: 10px;
                font-family: 'Courier New', monospace;
                font-size: 13px; line-height: 1.5;
                white-space: pre-wrap; color: #000; background: #fff;
            }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
    <div class="box">
        <h1>LOGIN KASIR ANNARIA</h1>
        <label>Masuk Sebagai</label>
        <div class="input-wrap">
            <select id="pilihPeran">
                <option value="admin">👤 Admin</option>
                <option value="kasir">👤Kasir</option>
                <option value="pemilik">👤Pemilik Toko</option>
            </select>
        </div>
        <label>Username</label>
        <div class="input-wrap">
            <input type="text" id="user" placeholder="Masukkan username">
        </div>
        <label>Password</label>
        <div class="input-wrap">
            <input type="password" id="pass" placeholder="Masukkan password" onkeypress="if(event.key==='Enter') login()">
            <button type="button" class="mata" id="btnMata" onclick="toggleMata()">👁️</button>
        </div>
        <button class="btn-merah" onclick="login()">MASUK KE APLIKASI</button>
        <div id="msg"></div>
    </div>
</div>

<!-- ===== APLIKASI ===== -->
<div id="app">
    <div class="header">
        <h2>🛒 KASIR ANNA</h2>
        <span class="role-badge" id="roleBadge">Kasir</span>
        <button class="btn-logout" onclick="logout()">🚪 Keluar</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-page="kasir">KASIR</div>
        <div class="tab" data-page="riwayat">RIWAYAT</div>
        <div class="tab" data-page="stok">STOK</div>
    </div>

    <div class="content">
        <!-- KASIR -->
        <div id="kasir" class="page active">
            <h3>Transaksi Penjualan</h3>
            <p>Barang: <select id="barang"></select></p>
            <p>Harga: <input type="text" id="harga" readonly class="short"></p>
            <p>Jumlah: <input type="number" id="qty" min="1" class="short">
            <button class="btn btn-amber" style="margin-left:8px;" onclick="tambah()">Tambah</button></p>

            <table id="tbl">
                <tr><th>No</th><th>Nama</th><th>Harga</th><th>Jml</th><th>Sub</th></tr>
            </table>
            <div class="total">Total: Rp <span id="total">0</span></div>
            <p>Bayar: <input type="number" id="bayar" class="short" oninput="hitungKembalian()"></p>
            <p class="kembalian">Kembali: Rp <span id="kembalian">0</span></p>
            <p>
                <button class="btn btn-green" onclick="bayarSelesai()">PROSES BAYAR</button>
                <button class="btn btn-amber" onclick="hapusBaris()">HAPUS BARIS</button>
                <button class="btn btn-red" onclick="reset()">TRANSAKSI BARU</button>
            </p>
        </div>

        <!-- RIWAYAT -->
        <div id="riwayat" class="page">
            <h3>Riwayat Transaksi</h3>
            <table id="tblRiwayat">
                <tr><th>No</th><th>Waktu</th><th>Total</th><th>Bayar</th><th>Kembali</th></tr>
            </table>
        </div>

        <!-- STOK -->
        <div id="stok" class="page">
            <h3>Daftar Stok Barang</h3>
            <table id="tblStok">
                <tr><th>No</th><th>Nama Barang</th><th>Harga</th><th>Stok</th></tr>
            </table>
        </div>
    </div>
</div>

<!-- ===== MODAL STRUK ===== -->
<div id="modalStruk" class="modal">
    <div class="modal-box">
        <h3>✅ STRUK PEMBAYARAN</h3>
        <div id="isiStruk" class="struk"></div>
        <div class="modal-tombol">
            <button class="btn btn-blue" onclick="cetakStruk()">🖨️ CETAK</button>
            <button class="btn btn-gray" onclick="tutupStruk()">⬅️ KEMBALI KE KASIR</button>
        </div>
    </div>
</div>

<!-- Area cetak (hanya muncul saat print) -->
<div id="printArea"></div>

<script>
// ===== DATA AKUN LOGIN (3 AKUN) =====
var AKUN = [
    { id: "admin", user: "22Dec2007", pass: "Annaria Buulolo", role: "👤 Admin" },
    { id: "kasir", user: "kasir", pass: "kasir123", role: "🧾 Kasir" },
    { id: "pemilik", user: "pemilik", pass: "pemilik123", role: "👑 Pemilik Toko" }
];
var roleAktif = "";

var namaBarang = ["Beras Premium 5kg","Minyak Goreng 2L","Gula Pasir 1kg","Telur Ayam 1kg","Kopi Bubuk 100g","Teh Celup 25 kantong","Mie Instan Goreng","Susu UHT 250ml","Roti Tawar","Biskuit Coklat","Sabun Mandi","Sikat Gigi","Tisu Wajah","Kecap Manis 600ml","Saus Sambal"];
var hargaBarang = [75000,38000,16000,32000,8500,6000,3800,5500,12000,9500,4500,3500,18000,14000,11000];
var stok = [50,40,100,30,80,60,150,75,45,90,120,200,55,70,65];
var keranjang = [];
var riwayat = [];
var pilihBaris = null;
var strukTerakhir = "";

function format(n) { return new Intl.NumberFormat('id-ID').format(n); }

// ===== TOMBOL MATA: LIHAT / SEMBUNYIKAN PASSWORD =====
function toggleMata() {
    var inp = document.getElementById('pass');
    var btn = document.getElementById('btnMata');
    if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = '🙈';
    } else {
        inp.type = 'password';
        btn.textContent = '👁️';
    }
}

// ===== LOGIN (validasi sesuai peran yang dipilih) =====
function login() {
    var peranDipilih = document.getElementById('pilihPeran').value;
    var u = document.getElementById('user').value.trim();
    var p = document.getElementById('pass').value.trim();
    var msg = document.getElementById('msg');
    var akun = null;
    for (var i = 0; i < AKUN.length; i++) {
        if (AKUN[i].id === peranDipilih) { akun = AKUN[i]; break; }
    }
    if (akun && akun.user === u && akun.pass === p) {
        roleAktif = akun.role;
        msg.innerHTML = '<span class="ok">✅ Berhasil masuk! (' + akun.role + ')</span>';
        setTimeout(function(){
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('roleBadge').textContent = akun.role;
            init();
        }, 500);
    } else {
        msg.innerHTML = '<span class="err">⚠️ Username/Password salah untuk peran ini!</span>';
        document.getElementById('pass').value = '';
    }
}

function logout() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'flex';
    document.getElementById('user').value = '';
    document.getElementById('pass').value = '';
    document.getElementById('pilihPeran').selectedIndex = 0;
    document.getElementById('msg').innerHTML = '';
}

// ===== INISIALISASI =====
function init() {
    var sel = document.getElementById('barang');
    sel.innerHTML = '';
    for (var i = 0; i < namaBarang.length; i++) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = namaBarang[i];
        sel.appendChild(opt);
    }
    document.getElementById('harga').value = format(hargaBarang[0]);
    sel.onchange = function(){
        document.getElementById('harga').value = format(hargaBarang[this.value]);
    };

    var tabs = document.querySelectorAll('.tab');
    for (var j = 0; j < tabs.length; j++) {
        tabs[j].onclick = function(){
            var allTabs = document.querySelectorAll('.tab');
            for (var k = 0; k < allTabs.length; k++) allTabs[k].classList.remove('active');
            var allPages = document.querySelectorAll('.page');
            for (var l = 0; l < allPages.length; l++) allPages[l].classList.remove('active');
            this.classList.add('active');
            document.getElementById(this.getAttribute('data-page')).classList.add('active');
        };
    }
    tampilStok();
}

// ===== TAMBAH KE KERANJANG =====
function tambah() {
    var idx = parseInt(document.getElementById('barang').value);
    var qty = parseInt(document.getElementById('qty').value);
    if (!qty || qty <= 0) { alert('Masukkan jumlah!'); return; }
    if (qty > stok[idx]) { alert('Stok tidak cukup! Sisa: ' + stok[idx]); return; }
    stok[idx] -= qty;
    keranjang.push({ idx: idx, nama: namaBarang[idx], harga: hargaBarang[idx], jumlah: qty, sub: hargaBarang[idx] * qty });
    tampilKeranjang();
    tampilStok();
    document.getElementById('qty').value = '';
}

function tampilKeranjang() {
    var tbl = document.getElementById('tbl');
    var total = 0;
    tbl.innerHTML = '<tr><th>No</th><th>Nama</th><th>Harga</th><th>Jml</th><th>Sub</th></tr>';
    for (var i = 0; i < keranjang.length; i++) {
        var r = tbl.insertRow();
        (function(idx){ r.onclick = function(){ pilihBaris = idx; highlightRow(this); }; })(i);
        r.insertCell(0).textContent = i + 1;
        r.insertCell(1).textContent = keranjang[i].nama;
        r.insertCell(2).textContent = format(keranjang[i].harga);
        r.insertCell(3).textContent = keranjang[i].jumlah;
        r.insertCell(4).textContent = format(keranjang[i].sub);
        total += keranjang[i].sub;
    }
    document.getElementById('total').textContent = format(total);
    hitungKembalian();
}

function highlightRow(row) {
    var rows = document.querySelectorAll('#tbl tr');
    for (var i = 0; i < rows.length; i++) rows[i].style.background = '';
    row.style.background = '#eef';
}

function hitungKembalian() {
    var total = 0;
    for (var i = 0; i < keranjang.length; i++) total += keranjang[i].sub;
    var bayar = parseInt(document.getElementById('bayar').value) || 0;
    document.getElementById('kembalian').textContent = format(bayar >= total ? bayar - total : 0);
}

// ===== PROSES BAYAR & STRUK =====
function bayarSelesai() {
    var total = 0;
    for (var i = 0; i < keranjang.length; i++) total += keranjang[i].sub;
    var bayar = parseInt(document.getElementById('bayar').value) || 0;
    if (bayar < total) { alert('Uang kurang!'); return; }

    var kembali = bayar - total;
    var waktu = new Date().toLocaleString('id-ID');

    riwayat.unshift({ no: riwayat.length + 1, waktu: waktu, total: total, bayar: bayar, kembali: kembali });
    tampilRiwayat();

    var teks = '================================\n';
    teks += '         KASIR ANNA            \n';
    teks += '================================\n';
    teks += 'Waktu : ' + waktu + '\n';
    teks += 'Kasir : ' + roleAktif + '\n';
    teks += '--------------------------------\n';
    for (var j = 0; j < keranjang.length; j++) {
        var item = keranjang[j];
        teks += item.nama + '\n';
        teks += '  ' + format(item.harga) + ' x ' + item.jumlah + ' = ' + format(item.sub) + '\n';
    }
    teks += '--------------------------------\n';
    teks += 'TOTAL     : Rp ' + format(total) + '\n';
    teks += 'BAYAR     : Rp ' + format(bayar) + '\n';
    teks += 'KEMBALIAN : Rp ' + format(kembali) + '\n';
    teks += '================================\n';
    teks += '  Terima Kasih & Selamat Belanja\n';
    teks += '================================\n';

    strukTerakhir = teks;
    document.getElementById('isiStruk').textContent = teks;
    document.getElementById('modalStruk').classList.add('tampil');
}

// ===== CETAK STRUK (langsung dari halaman ini, tanpa jendela baru) =====
// ===== CETAK STRUK (pakai iframe — PASTI muncul jendela print di HP & laptop) =====
function cetakStruk() {
    var lama = document.getElementById('iframeCetak');
    if (lama) lama.parentNode.removeChild(lama);

    var iframe = document.createElement('iframe');
    iframe.id = 'iframeCetak';
    iframe.style.position = 'fixed';
    iframe.style.right = '0';
    iframe.style.bottom = '0';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = '0';
    document.body.appendChild(iframe);

    var doc = iframe.contentWindow.document;
    doc.open();
    doc.write(
        '<html><head><title>Struk Pembayaran</title></head>' +
        '<body style="font-family:\'Courier New\',monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;margin:10px;">' +
        strukTerakhir +
        '</body></html>'
    );
    doc.close();

    setTimeout(function(){
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
    }, 300);

    setTimeout(function(){
        var ifr = document.getElementById('iframeCetak');
        if (ifr) ifr.parentNode.removeChild(ifr);
    }, 5000);
}

function tutupStruk() {
    document.getElementById('modalStruk').classList.remove('tampil');
    reset();
}

function hapusBaris() {
    if (pilihBaris === null) { alert('Pilih baris dulu!'); return; }
    stok[keranjang[pilihBaris].idx] += keranjang[pilihBaris].jumlah;
    keranjang.splice(pilihBaris, 1);
    pilihBaris = null;
    tampilKeranjang();
    tampilStok();
}

function reset() {
    keranjang = [];
    pilihBaris = null;
    document.getElementById('bayar').value = '';
    tampilKeranjang();
}

function tampilStok() {
    var tbl = document.getElementById('tblStok');
    tbl.innerHTML = '<tr><th>No</th><th>Nama Barang</th><th>Harga</th><th>Stok</th></tr>';
    for (var i = 0; i < namaBarang.length; i++) {
        var r = tbl.insertRow();
        r.insertCell(0).textContent = i + 1;
        r.insertCell(1).textContent = namaBarang[i];
        r.insertCell(2).textContent = format(hargaBarang[i]);
        r.insertCell(3).textContent = stok[i];
    }
}

function tampilRiwayat() {
    var tbl = document.getElementById('tblRiwayat');
    tbl.innerHTML = '<tr><th>No</th><th>Waktu</th><th>Total</th><th>Bayar</th><th>Kembali</th></tr>';
    for (var i = 0; i < riwayat.length; i++) {
        var r = tbl.insertRow();
        r.insertCell(0).textContent = i + 1;
        r.insertCell(1).textContent = riwayat[i].waktu;
        r.insertCell(2).textContent = format(riwayat[i].total);
        r.insertCell(3).textContent = format(riwayat[i].bayar);
        r.insertCell(4).textContent = format(riwayat[i].kembali);
    }
}
</script>
</body>
</html>
